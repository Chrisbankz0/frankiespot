<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<!-- The title and description below are what show up when someone shares
     the link on WhatsApp. Edit them to match your business. -->
<title>Frankies Pot — Menu</title>
<meta name="description" content="Rice, spaghetti, beans and yam, with beef, chicken or turkey. Order on WhatsApp.">
<meta name="theme-color" content="#14100D">
<meta property="og:title" content="Frankies Pot — Your pot of goodness">
<meta property="og:description" content="Rice, spaghetti, beans and yam, with beef, chicken or turkey. Order on WhatsApp.">
<meta property="og:type" content="website">
<!-- Once the site is live, swap this for the full URL, e.g.
     https://frankiespot.netlify.app/images/share-cover.jpg
     That's the picture people see when the link is forwarded on WhatsApp. -->
<meta property="og:image" content="images/share-cover.jpg">

<link rel="icon" href="images/logo.jpg">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>

<body>

<header class="masthead">
  <div class="shell">
    <h1 class="brand" id="brandName"></h1>
    <p class="tagline" id="brandTagline"></p>
    <div class="facts" id="brandFacts"></div>
  </div>
</header>

<nav class="catnav" aria-label="Menu sections">
  <div class="catnav-inner" id="catnav"></div>
</nav>

<main class="shell" id="menu"></main>

<footer class="shell pagefoot" id="pageFoot"></footer>

<!-- Sticky bar, appears once something is in the cart -->
<div class="cartbar" id="cartBar">
  <div class="cartbar-inner">
    <button type="button" id="barBtn">
      <span><span class="pill" id="barCount">0</span>Review order</span>
      <span id="barTotal"></span>
    </button>
  </div>
</div>

<div class="scrim" id="scrim"></div>

<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" aria-hidden="true">
  <div class="grabber"></div>

  <div class="sheet-head">
    <h2 id="sheetTitle">Your order</h2>
    <div class="actions">
      <button type="button" class="linkbtn danger" id="clearBtn">Clear all</button>
      <button type="button" class="linkbtn" id="closeSheet">Close</button>
    </div>
  </div>

  <div class="lines" id="lines"></div>
  <div id="noticeSlot"></div>
  <div class="totals" id="totals"></div>

  <div class="sheet-foot">
    <button type="button" class="send" id="sendBtn">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
        <path d="M12.04 2C6.58 2 2.13 6.45 2.13 11.91c0 1.75.46 3.45 1.32 4.95L2 22l5.25-1.38a9.86 9.86 0 0 0 4.79 1.22h.01c5.46 0 9.91-4.45 9.91-9.91 0-2.65-1.03-5.14-2.9-7.01A9.82 9.82 0 0 0 12.04 2Zm5.8 14.16c-.25.69-1.43 1.32-1.98 1.4-.53.08-1.19.11-1.92-.12-.44-.14-1.01-.33-1.74-.64-3.06-1.32-5.06-4.4-5.21-4.61-.15-.2-1.25-1.66-1.25-3.17s.79-2.25 1.07-2.56c.28-.31.61-.38.81-.38.2 0 .41 0 .58.01.19.01.44-.07.69.53.25.6.86 2.11.94 2.26.08.15.13.33.03.53-.1.2-.15.33-.3.5-.15.18-.32.39-.45.53-.15.15-.31.32-.13.62.18.31.79 1.3 1.69 2.11 1.16 1.03 2.14 1.35 2.45 1.5.31.15.49.13.67-.08.18-.2.77-.9.98-1.21.2-.31.41-.26.69-.15.28.1 1.78.84 2.09.99.31.15.51.23.58.35.08.13.08.71-.17 1.4Z"/>
      </svg>
      Send order on WhatsApp
    </button>
    <p class="hint">This opens WhatsApp with your order already written out. Send it, and we'll confirm the delivery fee and payment details.</p>
  </div>
</div>

<!-- Dish detail view. Opens when a photo or name is tapped. -->
<div class="scrim" id="detailScrim"></div>
<div class="detail" id="detail" role="dialog" aria-modal="true" aria-labelledby="detailName" aria-hidden="true">
  <div class="detail-photo" id="detailPhoto">
    <button type="button" class="detail-close" id="detailClose" aria-label="Close">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
  </div>
  <div class="detail-body">
    <div class="detail-tags" id="detailTags"></div>
    <h2 id="detailName"></h2>
    <p class="detail-desc" id="detailDesc"></p>
    <div class="detail-price" id="detailPrice"></div>
  </div>
  <div class="detail-foot">
    <div class="stepper" id="detailStepper">
      <button type="button" id="detailMinus" aria-label="One fewer">&minus;</button>
      <span class="qty" id="detailQty">1</span>
      <button type="button" id="detailPlus" aria-label="One more">+</button>
    </div>
    <button type="button" class="detail-add" id="detailAdd"></button>
  </div>
</div>

<!-- menu.js must load first: it defines the data that app.js reads -->
<script src="menu.js"></script>
<script src="app.js"></script>
</body>
</html>
